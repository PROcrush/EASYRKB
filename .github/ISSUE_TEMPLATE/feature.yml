name: Feature request
description: Propose an improvement to rbxport
title: ""
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what successful behavior would look like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include hardware, rekordbox version, screenshots, or related links when relevant.
