name: Clean the runner
description: >-
  Remove build output and per-job caches from a self-hosted runner so a finished
  job, passed or failed, does not leave its disk use behind. Use it as the last
  step with `if: always()`.
runs:
  using: composite
  steps:
    - name: Remove build output and the job's cargo home
      shell: bash
      run: |
        rm -rf target dist test-results playwright-report dist-mock \
          "${CARGO_HOME:-$RUNNER_TEMP/cargo-home}"
        df -h . | tail -1
